name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal config or a link to the playground is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and browser
      placeholder: "@tessera/annotator 0.1.0, Chrome 130"
